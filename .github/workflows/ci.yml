name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"  # weekly dependency audit

permissions:
  contents: read

jobs:
  test:
    name: Tests, lint and security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest -q
      - name: Ruff
        run: ruff check .
      - name: Bandit
        run: bandit -q -r worldmap/app -c pyproject.toml
      - name: Dependency audit
        run: pip-audit -r worldmap/requirements.txt
      - name: JavaScript syntax
        run: node --check worldmap/app/worldmap/static/app.js
      - name: Privacy guard (no real data in the repo)
        run: python tools/privacy_check.py

  addon-lint:
    name: Add-on lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: frenck/action-addon-linter@v2
        with:
          path: "./worldmap"
