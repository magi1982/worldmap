name: Worldmap
version: "0.1.0"
slug: worldmap
description: Your trips on a map – from Home Assistant, photos and Google/Apple exports, with smart questions.
url: https://github.com/magi1982/worldmap
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:earth
panel_title: Worldmap
homeassistant_api: true
hassio_api: true
hassio_role: default
map:
  - media:ro
  - share:ro
options:
  persons: []
  who_options:
    - Paar
    - Familie
  hint_keywords: []
  home_zone: zone.home
  timezone: Europe/Zurich
  min_trip_km: 30
  poll_interval_min: 5
  history_days_on_start: 10
  routing: osrm
  osrm_url: https://router.project-osrm.org
  photo_folders: []
  photo_scan_hours: 24
  notify_service: ""
  notify_mode: weekly
  ask_below: hoch
  school_holidays: []
  max_upload_mb: 200
  log_level: info
schema:
  persons:
    - entity: match(^(person|device_tracker)\.[a-z0-9_]+$)
      label: str
      camera_models: str?
  who_options:
    - str
  hint_keywords:
    - str
  home_zone: match(^zone\.[a-z0-9_]+$)
  home_lat: float(-90,90)?
  home_lon: float(-180,180)?
  timezone: str
  min_trip_km: float(1,1000)
  poll_interval_min: int(1,60)
  history_days_on_start: int(0,30)
  routing: list(osrm|off)
  osrm_url: url
  photo_folders:
    - str
  photo_scan_hours: int(1,168)
  notify_service: str?
  notify_mode: list(off|instant|daily|weekly)
  ask_below: list(mittel|hoch|bestätigt)
  school_holidays:
    - match(^\d{4}-\d{2}-\d{2}\.\.\d{4}-\d{2}-\d{2}$)
  max_upload_mb: int(1,2000)
  log_level: list(debug|info|warning|error)
