name: Worldmap
version: "0.7.1"
slug: worldmap
description: Your trips on a map – from Home Assistant, OwnTracks and Google exports, with smart questions. Works offline.
url: https://github.com/magi1982/worldmap
arch:
  - aarch64
  - amd64
init: false
ingress: true
panel_icon: mdi:earth
panel_title: Worldmap
homeassistant_api: true
hassio_api: true
ports:
  8098/tcp: null
ports_description:
  8098/tcp: OwnTracks (optional, local network only)
options:
  persons: []
  groups: []
  who_options:
    - Paar
    - Familie
  hint_keywords: []
  home_zone: zone.home
  home_radius_m: 0
  work_radius_m: 300
  show_work: false
  home_airport: ""
  timezone: Europe/Zurich
  min_trip_km: 30
  min_day_trip_km: 100
  routine_days: 20
  poll_interval_min: 5
  history_days_on_start: 10
  routing: tiles
  owntracks: []
  notify_service: ""
  notify_mode: weekly
  ask_below: hoch
  school_holidays: []
  max_upload_mb: 200
  log_level: info
schema:
  persons:
    - entity: match(^(person|device_tracker)\.[a-z0-9_]+$)?
      label: str
      camera_models: str?
      color: match(^#[0-9a-fA-F]{6}$)?
  groups:
    - name: str
      members: str?
      extra: int(0,20)?
      color: match(^#[0-9a-fA-F]{6}$)?
  who_options:
    - str
  hint_keywords:
    - str
  home_zone: match(^zone\.[a-z0-9_]+$)
  home_lat: float(-90,90)?
  home_lon: float(-180,180)?
  home_radius_m: int(0,5000)
  work_lat: float(-90,90)?
  work_lon: float(-180,180)?
  work_radius_m: int(50,5000)
  show_work: bool
  home_airport: match(^([A-Za-z]{3})?$)?
  timezone: str
  min_trip_km: float(1,1000)
  min_day_trip_km: float(1,2000)?
  routine_days: int(0,3650)
  poll_interval_min: int(1,60)
  history_days_on_start: int(0,30)
  routing: list(tiles|off|osrm)
  owntracks:
    - user: match(^[a-z0-9_.-]{2,32}$)
      password: password
      label: str
  notify_service: str?
  notify_mode: list(off|instant|daily|weekly)
  ask_below: list(mittel|hoch|bestätigt)
  school_holidays:
    - match(^\d{4}-\d{2}-\d{2}\.\.\d{4}-\d{2}-\d{2}$)
  max_upload_mb: int(1,2000)
  log_level: list(debug|info|warning|error)
