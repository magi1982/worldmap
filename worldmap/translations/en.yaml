configuration:
  persons:
    name: Tracked persons
    description: >-
      person.* or device_tracker.* entities with GPS (e.g. from the Home Assistant Companion App).
      "label" is the name shown in the app, "camera_models" (comma-separated) assigns photos of these
      cameras to the person, e.g. "iPhone 15".
  groups:
    name: Groups
    description: Groups for "who was there?", e.g. Couple or Family. "members" = person names separated by commas, "extra" = people without a tracked phone (e.g. children). Easier in the app under Settings › People & groups.
  who_options:
    name: Group answers
    description: Extra answers for "who was there?", e.g. Couple, Family.
  hint_keywords:
    name: Folder keywords
    description: 'keyword=answer, e.g. "Dad=Dad + kids". If a photo folder contains the keyword, the answer is suggested.'
  home_zone:
    name: Home zone
    description: Zone that marks home. Distances are measured from here.
  home_lat:
    name: Home latitude (optional)
    description: Overrides the home zone.
  home_lon:
    name: Home longitude (optional)
    description: Overrides the home zone.
  home_radius_m:
    name: Home radius (m)
    description: Everything within this distance of home counts as home. 0 = radius of the home zone.
  work_lat:
    name: Workplace latitude (optional)
    description: Empty = the workplace is detected automatically (the place with the most weekday hours).
  work_lon:
    name: Workplace longitude (optional)
    description: See workplace latitude.
  work_radius_m:
    name: Workplace radius (m)
    description: Places within this distance of the workplace count as work.
  show_work:
    name: Show the workplace on the map
    description: Off = the workplace is never shown on the map (it still never counts as a trip).
  timezone:
    name: Time zone
    description: Used to turn timestamps into local days, e.g. Europe/Zurich.
  min_trip_km:
    name: Trip distance (km)
    description: A day counts as a trip when someone was at least this far from home.
  min_day_trip_km:
    name: Day trip distance (km)
    description: A day out without a night away counts as a trip only from this distance. Trips with a night away use "Trip distance".
  routine_days:
    name: Routine places (days)
    description: >-
      Places visited on at least this many days (work, school, family) never start a trip,
      so a daily commute is not counted as travel. 0 = off.
  poll_interval_min:
    name: Live poll interval (min)
    description: How often the positions of the tracked persons are stored.
  history_days_on_start:
    name: History on start (days)
    description: Positions read from the Home Assistant recorder when the add-on starts.
  routing:
    name: Rail and road network
    description: >-
      tiles = lay gaps onto the real rail and road network. The network comes from OpenStreetMap map tiles that are
      downloaded once by tile number and kept in the add-on – no positions are ever sent, afterwards it works offline.
      off = no routing.
  owntracks:
    name: OwnTracks (local, no cloud)
    description: >-
      Users for the OwnTracks app (HTTP mode). The phone keeps positions while you are away and sends them when it
      is back in your home network – no Nabu Casa or open port to the internet needed. Enable port 8098 below.
      Password at least 8 characters, label = person name in the app.
  notify_service:
    name: Notification service
    description: e.g. notify.mobile_app_phone. Empty = persistent notification in Home Assistant.
  notify_mode:
    name: Ask me
    description: When to send open questions – off, instant, daily or weekly.
  ask_below:
    name: Ask when confidence is below
    description: Trips with a lower confidence create a question.
  school_holidays:
    name: School holidays
    description: Ranges like 2026-07-04..2026-08-09. Trips in holidays are more likely family trips.
  max_upload_mb:
    name: Max. upload (MB)
    description: Largest file accepted by the import.
  log_level:
    name: Log level
    description: Amount of log output.
