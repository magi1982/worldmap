configuration:
  persons:
    name: Personen
    description: >-
      person.*- oder device_tracker.*-Entitäten mit GPS (z. B. aus der Home-Assistant-App).
      «label» ist der Name in der App, «camera_models» (mit Komma) ordnet Fotos dieser Kameras
      der Person zu, z. B. «iPhone 15».
  groups:
    name: Gruppen
    description: Gruppen für «Wer war dabei?», z. B. Paar oder Familie. «members» = Namen der Personen mit Komma, «extra» = Personen ohne erfasstes Handy (z. B. Kinder). Einfacher in der App unter Einstellungen › Personen & Gruppen.
  who_options:
    name: Gruppen-Antworten
    description: Weitere Antworten für «Wer war dabei?», z. B. Paar, Familie.
  hint_keywords:
    name: Stichwörter in Ordnern
    description: 'Stichwort=Antwort, z. B. «Papa=Papa + Kinder». Kommt das Wort im Fotoordner vor, wird die Antwort vorgeschlagen.'
  home_zone:
    name: Zuhause-Zone
    description: Zone für zu Hause. Entfernungen werden von hier gemessen.
  home_lat:
    name: Breitengrad zu Hause (optional)
    description: Ersetzt die Zone.
  home_lon:
    name: Längengrad zu Hause (optional)
    description: Ersetzt die Zone.
  home_radius_m:
    name: Umkreis Zuhause (m)
    description: Alles in diesem Abstand gilt als Zuhause. 0 = Radius der Zuhause-Zone.
  work_lat:
    name: Breitengrad Arbeit (optional)
    description: Leer = die Arbeit wird automatisch erkannt (der Ort mit den meisten Stunden an Werktagen).
  work_lon:
    name: Längengrad Arbeit (optional)
    description: Siehe Breitengrad Arbeit.
  work_radius_m:
    name: Umkreis Arbeit (m)
    description: Orte in diesem Abstand gelten als Arbeit.
  show_work:
    name: Arbeit auf der Karte zeigen
    description: Aus = die Arbeit erscheint nie auf der Karte (sie zählt trotzdem nie als Reise).
  home_airport:
    name: Heimatflughafen (IATA-Code)
    description: Flüge ohne GPS starten hier, z. B. ZRH. Leer = der Flughafen, von dem die meisten aufgezeichneten Flüge starten.
  timezone:
    name: Zeitzone
    description: Für die Umrechnung in lokale Tage, z. B. Europe/Zurich.
  min_trip_km:
    name: Reise ab (km)
    description: Ein Tag zählt als Reise, wenn jemand mindestens so weit weg war.
  min_day_trip_km:
    name: Tagesausflug ab (km)
    description: Ein Tag ohne Übernachtung zählt erst ab dieser Entfernung als Reise. Mit Übernachtung gilt «Reise ab (km)».
  routine_days:
    name: Alltagsorte (Tage)
    description: >-
      Orte, an denen man an mindestens so vielen Tagen war (Arbeit, Schule, Familie), starten
      keine Reise – der tägliche Arbeitsweg zählt so nicht als Reise. 0 = aus.
  poll_interval_min:
    name: Live-Abfrage (Min.)
    description: Wie oft die Positionen der Personen gespeichert werden.
  history_days_on_start:
    name: Verlauf beim Start (Tage)
    description: Positionen aus dem Home-Assistant-Recorder beim Start.
  route_service:
    name: Routen für Reisen ohne GPS
    description: osm = jede Auto-, Wohnmobil- und Busetappe einer von Hand erfassten Reise wird einmal beim kostenlosen OpenStreetMap-Routing-Server von FOSSGIS (routing.openstreetmap.de) angefragt. google = Google Routes API (braucht deinen API-Schlüssel mit aktivierter Routes API; 10'000 Anfragen pro Monat gratis). offline = nur das eingebaute Strassennetz, nichts wird gesendet. Gesendet werden nur Start und Ziel, auf etwa 2 km gerundet – nie Namen, Daten oder Personen. Flüge bleiben Bögen.
  place_search:
    name: Ortssuche beim Erfassen einer Reise
    description: offline = nur die eingebaute Liste (Europa genau, grosse Städte und Länder weltweit). osm = zusätzlich OpenStreetMap (gratis, das Suchwort geht an nominatim.openstreetmap.org). google = Google Maps (braucht einen eigenen API-Schlüssel mit „Places API“; das Suchwort geht an Google).
  google_maps_api_key:
    name: Google-Maps-API-Schlüssel (optional)
    description: Für Ortssuche und Routen „google“. In der Google Cloud Console mit der „Places API (New)“ und für Routen der „Routes API“ erstellen. Er bleibt im Add-on und wird in der App nie angezeigt.
  routing:
    name: Bahn- und Strassennetz
    description: >-
      tiles = Lücken auf das echte Bahn- und Strassennetz legen. Das Netz stammt aus OpenStreetMap-Kartenkacheln, die
      einmalig per Kachelnummer geladen und im Add-on gespeichert werden – es werden nie Positionen gesendet, danach
      läuft alles offline. off = kein Routing.
  owntracks:
    name: OwnTracks (lokal, ohne Cloud)
    description: >-
      Benutzer für die OwnTracks-App (HTTP-Modus). Das Handy sammelt die Positionen unterwegs und schickt sie, sobald
      es wieder im Heimnetz ist – ohne Nabu Casa und ohne offenen Port ins Internet. Unten Port 8098 aktivieren.
      Passwort mindestens 8 Zeichen, Label = Name der Person in der App.
  notify_service:
    name: Benachrichtigungsdienst
    description: z. B. notify.mobile_app_handy. Leer = Hinweis in Home Assistant.
  notify_mode:
    name: Fragen schicken
    description: Wann offene Fragen kommen – nie, sofort, täglich oder wöchentlich.
  ask_below:
    name: Fragen, wenn Sicherheit unter
    description: Reisen mit tieferer Sicherheit erzeugen eine Frage.
  school_holidays:
    name: Schulferien
    description: Zeiträume wie 2026-07-04..2026-08-09. In den Ferien ist eine Familienreise wahrscheinlicher.
  max_upload_mb:
    name: Max. Upload (MB)
    description: Grösste Datei beim Import.
  log_level:
    name: Log-Level
    description: Menge der Log-Ausgaben.
